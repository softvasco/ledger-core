name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release --coverage --coverage-output-format cobertura --results-directory ./coverage
      - name: coverage report
        if: hashFiles('coverage/**/*.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # v5.6.0
        with:
          reports: coverage/**/*.cobertura.xml
          targetdir: coverage/report
          reporttypes: MarkdownSummaryGithub;Cobertura
      - name: coverage summary
        if: hashFiles('coverage/report/SummaryGithub.md') != ''
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/report
          if-no-files-found: ignore

  # main stays on .NET 10 LTS; this catches what breaks on the next release before we move
  dotnet-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: point global.json at the 11.0 sdk
        run: |
          sed -i 's/"version": "10.0.100"/"version": "11.0.100"/' global.json
      - run: dotnet restore -p:DotNetVersion=11
      - run: dotnet build --no-restore -c Release -warnaserror -p:DotNetVersion=11
      - run: dotnet test --no-build -c Release -p:DotNetVersion=11

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
